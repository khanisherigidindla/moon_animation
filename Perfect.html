<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> PERFECT LYRICS </title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090208;
}

.reel {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 70, 125, .28),
            transparent 42%
        ),
        radial-gradient(
            circle at 15% 20%,
            rgba(255, 80, 140, .18),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(190, 20, 90, .22),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #080207,
            #260714,
            #54132f,
            #210611,
            #060106
        );
}

/* Soft cinematic glow */

.glow {
    position: absolute;
    width: 70vw;
    height: 70vw;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 70, 130, .22),
            transparent 68%
        );

    filter: blur(40px);

    animation: breathe 7s ease-in-out infinite alternate;
}

@keyframes breathe {
    from {
        transform: translate(-50%, -50%) scale(.85);
    }

    to {
        transform: translate(-50%, -50%) scale(1.15);
    }
}

/* Background floating hearts */

.hearts {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.heart {
    position: absolute;
    bottom: -80px;

    color: rgba(255, 150, 180, .58);

    text-shadow:
        0 0 10px rgba(255, 50, 120, .8),
        0 0 30px rgba(255, 30, 100, .5);

    animation: rise linear forwards;
}

@keyframes rise {

    0% {
        transform:
            translateY(0)
            translateX(0)
            scale(.5)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .7;
    }

    50% {
        transform:
            translateY(-50vh)
            translateX(40px)
            scale(1)
            rotate(12deg);
    }

    100% {
        transform:
            translateY(-120vh)
            translateX(-40px)
            scale(.8)
            rotate(-15deg);

        opacity: 0;
    }
}

/* Small glowing particles */

.particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #ffdce7;

    box-shadow:
        0 0 10px #ff9fbd;

    animation: sparkle 3s ease-in-out infinite;
}

@keyframes sparkle {

    0%, 100% {
        opacity: .1;
        transform: scale(.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.6);
    }
}


/* =================================================
   LYRIC AREA
   ================================================= */

.lyric-container {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 82%;

    z-index: 20;

    text-align: center;
}


/*
    IMPORTANT:

    All lyric lines occupy exactly the
    same position.

    Nothing moves around the screen.
*/

.lyric {

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    transform:
        translateY(-50%)
        scale(.98);

    opacity: 0;

    color: #fff8fb;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(38px, 5vw, 82px);

    line-height: 1.25;

    font-weight: 500;

    letter-spacing: .3px;

    text-align: center;

    /*
        Strong readability over
        moving background
    */

    text-shadow:

        0 3px 8px rgba(0,0,0,.9),

        0 0 20px rgba(255,60,120,.45),

        0 0 45px rgba(255,40,110,.25);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}


/* Active lyric */

.lyric.active {

    opacity: 1;

    transform:
        translateY(-50%)
        scale(1);
}


/* Tiny heart above lyrics */

.love-symbol {

    position: absolute;

    left: 50%;
    top: -110px;

    transform: translateX(-50%);

    font-family: Arial, sans-serif;

    font-size: 42px;

    color: #ffb1c9;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,50,120,.9)
        );

    animation: heartbeat 1.6s infinite;
}

@keyframes heartbeat {

    0%, 100% {
        transform:
            translateX(-50%)
            scale(1);
    }

    15% {
        transform:
            translateX(-50%)
            scale(1.2);
    }

    30% {
        transform:
            translateX(-50%)
            scale(1);
    }

    45% {
        transform:
            translateX(-50%)
            scale(1.12);
    }
}


/* Bottom subtle line */

.bottom-heart {

    position: absolute;

    bottom: 7%;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color:
        rgba(255,200,215,.55);

    font-family: Arial, sans-serif;

    font-size: 18px;

    letter-spacing: 5px;
}


/* Cinematic vignette */

.vignette {

    position: absolute;

    inset: 0;

    z-index: 15;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.18) 65%,
            rgba(0,0,0,.7) 100%
        );
}


/* Responsive */

@media (max-width: 900px) {

    .lyric-container {
        width: 88%;
    }

    .lyric {
        font-size: 7vw;
    }
}

</style>
</head>


<body>

<div class="reel">

    <!-- Cinematic glow -->
    <div class="glow"></div>

    <!-- Floating hearts -->
    <div
        class="hearts"
        id="hearts">
    </div>

    <!-- Sparkles -->
    <div
        class="particles"
        id="particles">
    </div>


    <!-- ================================
         LYRICS
    ================================= -->

    <div class="lyric-container">

        <div class="love-symbol">
            ♡
        </div>


        <!-- LINE 1 -->

        <div class="lyric active">
            Darling, just hold my hand
        </div>


        <!-- LINE 2 -->

        <div class="lyric">
            Be my girl, I'll be your man
        </div>


        <!-- LINE 3 -->

        <div class="lyric">
            I see my future in your eyes
        </div>


        <!-- LINE 4 -->

        <div class="lyric">
            Baby, I'm dancing in the dark
        </div>


        <!-- LINE 5 -->

        <div class="lyric">
            With you between my arms
        </div>

    </div>


    <div class="bottom-heart">
        ♥
    </div>


    <div class="vignette"></div>

</div>


<script>

/* =========================================
   LYRIC TIMING
========================================= */

/*
    Per-line duration in milliseconds.

    Bigger number = line stays longer (slower).
    Smaller number = line changes faster.

    ORDER from fastest to slowest:
    LINES 1 & 2 (3.5 s) < LINE 3 (5 s) <
    LINE 4 (7.5 s) < LINE 5 (9 s)
*/

const LINE_DURATIONS = [
    3500, // Line 1 - "Darling, just hold my hand"
    3500, // Line 2 - "Be my girl, I'll be your man"
    5000, // Line 3 - "I see my future in your eyes"
    7500, // Line 4 - "Baby, I'm dancing in the dark" - MORE
    9000  // Line 5 - "With you between my arms" - MOST
];


const lyrics =
    document.querySelectorAll(".lyric");


let current = 0;


function nextLyric() {

    lyrics[current]
        .classList
        .remove("active");


    current++;


    if (current >= lyrics.length) {
        current = 0;
    }


    lyrics[current]
        .classList
        .add("active");


    /* Keep the cycle going with THIS line's duration */

    setTimeout(
        nextLyric,
        LINE_DURATIONS[current]
    );
}


/* Start the cycle (LINE 1 is already active in the HTML) */

setTimeout(
    nextLyric,
    LINE_DURATIONS[0]
);


/* =========================================
   FLOATING HEARTS
========================================= */

const heartContainer =
    document.getElementById("hearts");


const heartSymbols = [
    "♥",
    "♡",
    "❤",
    "💕",
    "💗",
    "💖"
];


function createHeart() {

    const heart =
        document.createElement("span");


    heart.className = "heart";


    heart.textContent =
        heartSymbols[
            Math.floor(
                Math.random() *
                heartSymbols.length
            )
        ];


    heart.style.left =
        Math.random() * 100 + "%";


    heart.style.fontSize =
        (16 + Math.random() * 35) + "px";


    const duration =
        7 + Math.random() * 7;


    heart.style.animationDuration =
        duration + "s";


    heartContainer.appendChild(
        heart
    );


    setTimeout(
        () => heart.remove(),
        (duration + 1) * 1000
    );
}


/* Keep background alive */

setInterval(
    createHeart,
    450
);


/* Initial hearts */

for (
    let i = 0;
    i < 20;
    i++
) {

    setTimeout(
        createHeart,
        i * 200
    );
}


/* =========================================
   PARTICLES
========================================= */

const particleContainer =
    document.getElementById(
        "particles"
    );


for (
    let i = 0;
    i < 80;
    i++
) {

    const particle =
        document.createElement("span");


    particle.className =
        "particle";


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.top =
        Math.random() * 100 + "%";


    const size =
        1 + Math.random() * 3;


    particle.style.width =
        size + "px";


    particle.style.height =
        size + "px";


    particle.style.animationDuration =
        (2 + Math.random() * 4) + "s";


    particle.style.animationDelay =
        Math.random() * 4 + "s";


    particleContainer.appendChild(
        particle
    );
}

</script>

</body>
</html>
